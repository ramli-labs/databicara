<!DOCTYPE html>
<html lang="id">
<head>

<style>
:root{--ink:#1A2433;--muted:#5B6575;--teal:#16324F;--teal2:#1D6FA5;--teal3:#2E8BC0;--mint:#E8F1F8;--mint2:#D3E4F1;--amber:#F4B942;--coral:#E4572E;--green:#4C9A6A;--line:#D6E0EA;--bg:#F6F9FC;--r:14px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--teal2)}
.big{font-size:19px}
header.top{background:var(--teal);color:#fff;position:sticky;top:0;z-index:20}
.top .in{max-width:1080px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;font-weight:800;letter-spacing:.5px}
.brand .logo{width:34px;height:34px;border-radius:10px;background:var(--amber);display:grid;place-items:center;color:var(--teal);font-size:18px}
.brand small{display:block;font-weight:500;letter-spacing:0;opacity:.8;font-size:12px}
.top .sp{flex:1}
.chip{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:999px;padding:5px 12px;font-size:14px;cursor:pointer}
.chip.warn{background:var(--amber);color:var(--teal);border-color:var(--amber);font-weight:700}
main{max-width:1080px;margin:0 auto;padding:22px 18px 80px}
h1{font-size:28px;line-height:1.2;margin:4px 0 8px}
h2{font-size:21px;margin:26px 0 10px}
h3{font-size:17px;margin:16px 0 6px}
.muted{color:var(--muted)}
.crumb{font-size:14px;color:var(--muted);margin-bottom:6px}
.crumb a{text-decoration:none}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.hero{background:var(--teal);color:#fff;border-radius:18px;padding:26px;position:relative;overflow:hidden}
.hero .pq{font-size:20px;font-style:italic;max-width:760px;margin-top:10px}
.hero .tag{color:var(--amber);font-weight:700;font-size:13px;letter-spacing:1.5px;text-transform:uppercase}
.pcard{display:block;text-decoration:none;color:inherit;transition:transform .12s,box-shadow .12s}
.pcard:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(15,61,62,.12)}
.pnum{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--teal2);color:#fff;font-weight:800;font-size:17px}
.badge{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px;background:var(--mint);color:var(--teal)}
.badge.soon{background:#F1F1F1;color:#777}
.badge.done{background:#E3F1DD;color:#3D6B2F}
.badge.grp{background:#FCEBD3;color:#8A5A10}
.bar{height:8px;background:var(--mint);border-radius:9px;overflow:hidden;margin-top:10px}
.bar>i{display:block;height:100%;background:var(--teal3)}
.klist{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.kitem{display:flex;gap:14px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-decoration:none;color:inherit}
a.kitem:hover{border-color:var(--teal3)}
.kitem.soon{opacity:.75}
.kitem .n{width:34px;height:34px;flex:none;border-radius:50%;background:var(--mint);display:grid;place-items:center;font-weight:800;color:var(--teal)}
.kitem.isdone .n{background:var(--green);color:#fff}
.kitem .t{flex:1}
.kitem .t b{display:block}
.kitem .m{font-size:13px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:11px;padding:11px 18px;font-weight:700;cursor:pointer;background:var(--teal2);color:#fff;text-decoration:none}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{background:#B8C6C5;cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--teal2);border:2px solid var(--teal2)}
.btn.amber{background:var(--amber);color:var(--teal)}
.btn.sm{padding:6px 12px;font-size:14px;border-radius:9px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.note{background:var(--mint);border-radius:12px;padding:12px 14px;margin:12px 0}
.note.amber{background:#FDF0DA}
.note.coral{background:#FBE3DC}
.note b:first-child{color:var(--teal)}
label.f{display:block;font-weight:700;margin:14px 0 6px}
input[type=text],input[type=number],input[type=password],input[type=url],select,textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff}
textarea{min-height:84px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:3px solid rgba(42,157,143,.25);border-color:var(--teal3)}
.inst{background:#fff;border-left:0;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:10px 0 18px}
.inst ol{margin:6px 0 0;padding-left:22px}
.status{margin-top:12px;font-weight:700}
.status.ok{color:#3D6B2F}.status.q{color:#8A5A10}.status.err{color:var(--coral)}
.timer{font-variant-numeric:tabular-nums}
/* sortir */
.sort{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
@media(max-width:820px){.sort{grid-template-columns:1fr}}
.zone{background:#fff;border:2px dashed var(--line);border-radius:14px;padding:10px;min-height:160px}
.zone h3{margin:2px 4px 10px;display:flex;justify-content:space-between}
.zone.a{border-color:var(--teal3)}.zone.p{border-color:#264653}
.zone.over{background:var(--mint)}
.kartu{background:#fff;border:1px solid var(--line);border-radius:11px;padding:9px 11px;margin-bottom:8px;box-shadow:0 1px 3px rgba(0,0,0,.06);cursor:grab}
.kartu .jam{font-weight:800;color:var(--coral)}
.kartu .act{display:flex;gap:6px;margin-top:6px}
.kartu.ok{border:2px solid var(--green)}.kartu.no{border:2px solid var(--coral)}
.kartu .fb{font-size:13px;margin-top:6px;color:var(--muted)}
.mini{font-size:13px;padding:4px 10px;border-radius:8px;border:1.5px solid var(--teal2);background:#fff;color:var(--teal2);font-weight:700;cursor:pointer}
.mini.p{border-color:#264653;color:#264653}
/* profil */
.phone{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;max-width:620px}
.phead{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.ava{width:52px;height:52px;border-radius:50%;background:var(--amber);display:grid;place-items:center;font-size:26px}
.posts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.post{border:0;border-radius:10px;padding:0;overflow:hidden;cursor:pointer;background:#fff;text-align:left;box-shadow:0 0 0 1px var(--line)}
.post .img{height:86px;display:grid;place-items:center;font-size:38px;color:#fff;position:relative}
.post .cap{font-size:12.5px;padding:6px 8px;color:var(--ink);min-height:52px}
.post.cell{box-shadow:0 0 0 3px var(--amber)}
.post .ck{position:absolute;top:6px;right:8px;background:#fff;color:var(--green);border-radius:50%;width:22px;height:22px;display:none;place-items:center;font-size:14px;font-weight:900}
.post.filled .ck{display:grid}
.chk{display:flex;gap:8px;align-items:flex-start;margin:6px 0;cursor:pointer}
.chk input{margin-top:4px;width:18px;height:18px;flex:none}
/* tabel */
table{border-collapse:collapse;width:100%;background:#fff;font-size:15px}
th,td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
th{background:var(--teal);color:#fff;font-weight:700}
tbody tr:nth-child(even){background:#F8FBFB}
.tw{overflow-x:auto;border-radius:12px}
/* audit */
.aud{display:flex;gap:12px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:10px 0}
.aud .tx{flex:1}
.aud .alt{font-size:13px;color:#8A5A10;margin-top:3px}
.tog{display:flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;flex:none}
.tog button{border:0;background:#fff;padding:7px 14px;font-weight:700;cursor:pointer}
.tog button.on.y{background:var(--green);color:#fff}.tog button.on.n{background:var(--coral);color:#fff}
.zonebox{border-radius:14px;padding:16px;color:#fff;font-weight:700}
.z-h{background:var(--green)}.z-k{background:var(--amber);color:var(--teal)}.z-m{background:var(--coral)}.z-0{background:#B8C6C5}
.stat{font-size:40px;font-weight:800;line-height:1}
.choice{display:grid;gap:8px}
.choice label{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;cursor:pointer}
.choice label:has(input:checked){border-color:var(--teal3);background:var(--mint)}
.choice input{margin-top:4px}
.fbk{margin-top:8px;font-size:14px}
.right{color:#3D6B2F;font-weight:700}.wrong{color:var(--coral);font-weight:700}
.tf{display:flex;gap:8px}
.tf label{border:1.5px solid var(--line);border-radius:9px;padding:6px 14px;cursor:pointer;background:#fff;font-weight:700}
.tf label:has(input:checked){background:var(--teal2);color:#fff;border-color:var(--teal2)}
.tf input{position:absolute;opacity:0;pointer-events:none}
.q{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0}
.pid main{max-width:1400px}.pid body,.pid{font-size:20px}.pid table{font-size:19px}
.modal{position:fixed;inset:0;background:rgba(15,61,62,.55);display:grid;place-items:center;z-index:50;padding:16px}
.modal .card{max-width:440px;width:100%}
footer.ft{text-align:center;color:var(--muted);font-size:13px;padding:20px}
/* worksheet tiruan */
.ss{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;user-select:none;font-size:14px}
.ss-bar{display:flex;gap:6px;padding:8px;background:#F1F5F9;border-bottom:1px solid var(--line)}
.ss-nb{width:70px;border:1px solid #B9C6D3;background:#fff;border-radius:6px;padding:4px 8px;font-weight:700;cursor:pointer}
.ss-fx{flex:1;border:1px solid #B9C6D3;background:#fff;border-radius:6px;padding:4px 8px;cursor:pointer;white-space:nowrap;overflow:hidden}
.ss-fx i{color:#888;font-weight:700;margin-right:6px}
.ss table{font-size:13.5px;border-radius:0}
.ss th{background:#E9EEF3;color:#334;text-align:center;cursor:pointer;padding:5px 6px;font-weight:600}
.ss th.ss-c{cursor:default}
.ss td{padding:5px 7px;cursor:pointer;white-space:nowrap}
.ss td.h{font-weight:700;background:#F7FAFC}
.ss td:hover,.ss th:hover:not(.ss-c),.ss-nb:hover,.ss-fx:hover,.ss-tabs span:hover{outline:2px solid var(--teal3);outline-offset:-2px}
.ss td.hl{background:#FFF1B8}
.ss tbody tr:nth-child(even){background:#fff}
.ss-tabs{display:flex;gap:2px;background:#F1F5F9;border-top:1px solid var(--line);padding:4px 6px 0}
.ss-tabs span{padding:5px 14px;border-radius:7px 7px 0 0;cursor:pointer;color:#445}
.ss-tabs span.on{background:#fff;font-weight:700;color:var(--teal2)}
code{background:var(--mint);border-radius:5px;padding:1px 6px;font-family:Consolas,monospace}
</style>
</head>

/* ===================== PENYIMPANAN ===================== */
const mem = {};
const store = {
  get(k, d) { try { const v = localStorage.getItem('databicara.' + k); return v ? JSON.parse(v) : (k in mem ? mem[k] : d); } catch (e) { return k in mem ? mem[k] : d; } },
  set(k, v) { mem[k] = v; try { localStorage.setItem('databicara.' + k, JSON.stringify(v)); } catch (e) {} },
  del(k) { delete mem[k]; try { localStorage.removeItem('databicara.' + k); } catch (e) {} },
  clearPrefix(p) { Object.keys(mem).forEach(k => k.startsWith(p) && delete mem[k]); try { Object.keys(localStorage).forEach(k => k.startsWith('databicara.' + p) && localStorage.removeItem(k)); } catch (e) {} },
};
const scriptURL = () => (store.get('guru.url', '') || CONFIG.APPS_SCRIPT_URL || '').trim();
const rosterOf = kelas => (store.get('roster.' + kelas, null) || {}).data || [];
async function ambilRoster(kelas, kode) {
  const url = scriptURL(); if (!url) throw new Error('Web belum tersambung ke Google Sheet');
  const res = await fetch(url + '?' + new URLSearchParams({ aksi: 'murid', kelas, kode }));
  const j = await res.json(); if (!j.ok) throw new Error(j.pesan || 'gagal');
  store.set('roster.' + kelas, { kode, data: j.data }); return j.data;
}
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const $$ = (s, el = document) => [...el.querySelectorAll(s)];

async function postPayload(p) {
  const url = scriptURL();
  if (!url) return 'lokal';
  const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(p) });
  const j = await res.json();
  if (!j.ok) throw new Error(j.pesan || 'gagal');
  return 'terkirim';
}
async function kirim(pn, kg, data) {
  const u = profil();
  const payload = { waktu: new Date().toISOString(), nama: u.nama, kelas: u.kelas, absen: u.absen, kelompok: u.kelompok || '', pertemuan: 'P' + pn, kegiatan: kg.id, judul: kg.judul,
    skor: data.skor ?? '', maks: data.maks ?? '', ringkasan: data.ringkasan || '', jawaban: JSON.stringify(data.jawaban || {}), kode: u.kode || '' };
  if (data.anggota && data.anggota.length) payload.anggota = data.anggota;
  if (data.kelompok) payload.kelompok = data.kelompok;
  const riwayat = store.get('riwayat', []); riwayat.push(payload); store.set('riwayat', riwayat.slice(-200));
  let hasil;
  try { hasil = await postPayload(payload); } catch (e) { const q = store.get('antrean', []); q.push(payload); store.set('antrean', q); hasil = 'antre'; }
  markDone(pn, kg.id, { skor: payload.skor, maks: payload.maks, waktu: payload.waktu });
  store.del(`draft.P${pn}-${kg.id}`);
  renderChips();
  return hasil;
}
async function flushQueue(manual) {
  let q = store.get('antrean', []); if (!q.length || !scriptURL()) { if (manual && !scriptURL()) alertBox('Belum terhubung', 'Web ini belum disambungkan ke Google Sheet (mode coba). Hubungi guru.'); return; }
  const sisa = [];
  for (const p of q) { try { await postPayload(p); } catch (e) { sisa.push(p); } }
  store.set('antrean', sisa); renderChips();
  if (manual) alertBox(sisa.length ? 'Masih ada yang gagal' : 'Berhasil', sisa.length ? `${sisa.length} jawaban belum terkirim. Periksa internet lalu coba lagi.` : 'Semua jawaban sudah terkirim ke guru.');
}

function bindDraft(root, key) {
  const d = store.get('draft.' + key, {});
  $$('[name]', root).forEach(el => { if (el.dataset.nodraft !== undefined) return; if (d[el.name] !== undefined) { if (el.type === 'checkbox' || el.type === 'radio') el.checked = (d[el.name + '::' + el.value] === true); else el.value = d[el.name]; } });
  root.addEventListener('input', e => { const el = e.target; if (!el.name || el.dataset.nodraft !== undefined) return; const cur = store.get('draft.' + key, {}); if (el.type === 'checkbox' || el.type === 'radio') { if (el.type === 'radio') $$(`[name="${el.name}"]`, root).forEach(r => cur[r.name + '::' + r.value] = r.checked); else cur[el.name + '::' + el.value] = el.checked; cur[el.name] = 1; } else cur[el.name] = el.value; store.set('draft.' + key, cur); });
}

  const u = profil(); if (kg.jenis !== 'kelompok' || !scriptURL() || !u.kode) return;

      <div class="card"><div class="stat">${sk.length ? (sk.reduce((a, b) => a + b, 0) / sk.length).toFixed(1) : '–'}${maks ? `<span style="font-size:20px">/${esc(maks)}</span>` : ''}</div><div class="muted">rerata skor</div></div>
      ${zona ? `<div class="card">${zona.map(([z, c]) => `<div class="row" style="justify-content:space-between"><b>${z}</b><span class="stat" style="font-size:26px">${c}</span></div>`).join('')}</div>` : ''}</div>
      ${kelas && murid.length ? `<h2>Belum mengerjakan (${belum.length})</h2><div class="card">${belum.length ? belum.map(m => `${esc(m.absen)}. ${esc(m.nama)}`).join(' · ') : '<span class="right">Semua murid sudah tercatat.</span>'}</div>` : (url && !kelas ? '<div class="note">Pilih satu kelas untuk melihat daftar murid yang belum mengerjakan.</div>' : '')}
      ${k === 'survei' && p === '1' && rows.length ? `<div class="note"><b>Data survei untuk Pertemuan 2.</b> Unduh tanpa nama dan absen (urutan diacak), lalu bagikan ke murid. <button class="btn sm" type="button" id="gCsv">Unduh CSV tanpa nama</button></div>` : ''}
      <h2>Rincian</h2><div class="tw"><table><thead><tr><th>Kelas</th><th>Absen</th><th>Nama</th><th>Klp</th><th>Skor</th><th>Ringkasan jawaban</th><th>Dikirim oleh</th><th>Waktu</th></tr></thead>
      <tbody>${rows.map(r => `<tr><td>${esc(r.kelas)}</td><td>${esc(r.absen)}</td><td>${esc(r.nama)}</td><td>${esc(r.kelompok)}</td><td>${esc(r.skor)}${r.maks ? '/' + esc(r.maks) : ''}</td><td>${esc(r.ringkasan)}</td><td>${r.oleh && r.oleh !== r.nama ? esc(r.oleh) : ''}</td><td style="white-space:nowrap">${esc(new Date(r.waktu).toLocaleString('id-ID', { dateStyle: 'short', timeStyle: 'short' }))}</td></tr>`).join('') || '<tr><td colspan="8" class="muted">Belum ada kiriman.</td></tr>'}</tbody></table></div>`;
    const bCsv = $('#gCsv'); if (bCsv) bCsv.onclick = () => {
      const ambil = r => { let j = r.jawaban; try { if (typeof j === 'string') j = JSON.parse(j); } catch (e) { j = null; }
        if (j && j.tidur !== undefined) return [j.tidur, j.layar, j.sarapan, j.olahraga, j.air];
        const m = String(r.ringkasan).match(/Tidur ([\d.]+) · Layar ([\d.]+) · Sarapan ([\d.]+) · Olahraga ([\d.]+) · Air ([\d.]+)/); return m ? m.slice(1).map(Number) : null; };
      const data = rows.map(r => [r.kelas, ...(ambil(r) || [])]).filter(x => x.length === 6);
      for (let i = data.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [data[i], data[j]] = [data[j], data[i]]; }
      const csv = ['ID,Kelas,Tidur,Layar,Sarapan,Olahraga,Air', ...data.map((d, i) => ['S' + String(i + 1).padStart(3, '0'), ...d].join(','))].join('\n');
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' })); a.download = `Survei_${kelas || 'Semua'}_tanpa_nama.csv`; a.click();
    };
  };
}

/* ===================== MULAI ===================== */
render(); flushQueue(false);
</script>
</body>
</html>
